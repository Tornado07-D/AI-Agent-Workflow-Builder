# Query: Fetch org workflows with steps, triggers, and recent run status.
# Also fetches the usage aggregation for quota display.
query GetOrgWorkflows($org_id: uuid!) {
  organizations_by_pk(id: $org_id) {
    id
    name
    quota_calls_used
    quota_calls_allowed
    workflows(order_by: { created_at: desc }) {
      id
      name
      description
      created_at
      average_run_duration
      steps(order_by: { step_order: asc }) {
        id
        step_order
        type
        config
      }
      triggers {
        id
        type
        config
      }
      runs(order_by: { created_at: desc }, limit: 1) {
        id
        status
        started_at
        finished_at
      }
    }
  }
}

# Mutation: Create/edit workflow + steps + triggers in ONE transaction
# By passing an array of objects to steps and triggers, Hasura inserts them.
# The `on_conflict` clause lets us edit an existing workflow.
# Since deleting and re-inserting steps is easier for an editor, we group deletions and insertions in one atomic mutation block.
mutation SaveWorkflowAndSteps(
  $workflow_id: uuid!,
  $org_id: uuid!,
  $name: String!,
  $description: String,
  $steps: [workflow_steps_insert_input!]!,
  $triggers: [workflow_triggers_insert_input!]!
) {
  insert_workflows_one(
    object: {
      id: $workflow_id,
      org_id: $org_id,
      name: $name,
      description: $description
    },
    on_conflict: {
      constraint: workflows_pkey,
      update_columns: [name, description, updated_at]
    }
  ) { id }
  
  delete_workflow_steps(where: { workflow_id: { _eq: $workflow_id } }) { affected_rows }
  insert_workflow_steps(objects: $steps) { affected_rows }

  delete_workflow_triggers(where: { workflow_id: { _eq: $workflow_id } }) { affected_rows }
  insert_workflow_triggers(objects: $triggers) { affected_rows }
}

# Mutation: Trigger a run (calls nhost serverless function via Hasura Action)
mutation TriggerRun($workflow_id: uuid!) {
  triggerWorkflowRun(workflow_id: $workflow_id) {
    run_id
  }
}

# Mutation: Approve a paused step (calls nhost serverless function via Hasura Action)
mutation ApproveStep($step_run_id: uuid!) {
  approveStep(step_run_id: $step_run_id) {
    success
    run_id
  }
}

# Subscription: Watch the run's progress in real-time
subscription WatchStepRuns($run_id: uuid!) {
  workflow_runs_by_pk(id: $run_id) {
    id
    status
    started_at
    finished_at
  }
  step_runs(where: { workflow_run_id: { _eq: $run_id } }, order_by: { created_at: asc }) {
    id
    workflow_step_id
    status
    input
    output
    error
    attempt_count
    approved_by
    approved_at
  }
}
