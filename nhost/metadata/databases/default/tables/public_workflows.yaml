table:
  name: workflows
  schema: public
object_relationships:
  - name: org
    using:
      foreign_key_constraint_on: org_id
array_relationships:
  - name: runs
    using:
      foreign_key_constraint_on:
        column: workflow_id
        table:
          name: workflow_runs
          schema: public
  - name: steps
    using:
      foreign_key_constraint_on:
        column: workflow_id
        table:
          name: workflow_steps
          schema: public
  - name: triggers
    using:
      foreign_key_constraint_on:
        column: workflow_id
        table:
          name: workflow_triggers
          schema: public
computed_fields:
  - name: average_run_duration
    definition:
      function:
        name: avg_run_duration
        schema: public
insert_permissions:
  - role: user
    permission:
      check:
        org:
          members:
            _and:
              - user_id:
                  _eq: X-Hasura-User-Id
              - role:
                  _in:
                    - owner
                    - editor
select_permissions:
  - role: user
    permission:
      columns:
        - id
        - org_id
        - name
        - description
        - created_by
        - created_at
        - updated_at
      computed_fields:
        - average_run_duration
      filter:
        org:
          members:
            user_id:
              _eq: X-Hasura-User-Id
update_permissions:
  - role: user
    permission:
      columns:
        - name
        - description
      filter:
        org:
          members:
            _and:
              - user_id:
                  _eq: X-Hasura-User-Id
              - role:
                  _in:
                    - owner
                    - editor
      check: null
delete_permissions:
  - role: user
    permission:
      filter:
        org:
          members:
            _and:
              - user_id:
                  _eq: X-Hasura-User-Id
              - role:
                  _in:
                    - owner
                    - editor
