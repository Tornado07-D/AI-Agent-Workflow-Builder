table:
  name: step_runs
  schema: public
object_relationships:
  - name: step
    using:
      foreign_key_constraint_on: workflow_step_id
  - name: workflow_run
    using:
      foreign_key_constraint_on: workflow_run_id
select_permissions:
  - role: user
    permission:
      columns:
        - id
        - workflow_run_id
        - workflow_step_id
        - status
        - input
        - output
        - error
        - attempt_count
        - approved_by
        - approved_at
        - created_at
        - updated_at
      filter:
        workflow_run:
          org:
            members:
              user_id:
                _eq: X-Hasura-User-Id
