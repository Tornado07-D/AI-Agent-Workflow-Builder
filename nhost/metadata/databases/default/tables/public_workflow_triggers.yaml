table:
  name: workflow_triggers
  schema: public
object_relationships:
  - name: workflow
    using:
      foreign_key_constraint_on: workflow_id
insert_permissions:
  - role: user
    permission:
      check:
        _or:
          - _and:
              - type:
                  _eq: "webhook"
              - workflow:
                  org:
                    members:
                      _and:
                        - user_id:
                            _eq: X-Hasura-User-Id
                        - role:
                            _eq: owner
          - _and:
              - type:
                  _neq: "webhook"
              - workflow:
                  org:
                    members:
                      _and:
                        - user_id:
                            _eq: X-Hasura-User-Id
                        - role:
                            _in:
                              - owner
                              - editor
select_permissions:
  - role: user
    permission:
      columns:
        - id
        - workflow_id
        - type
        - config
        - created_at
      filter:
        workflow:
          org:
            members:
              user_id:
                _eq: X-Hasura-User-Id
update_permissions:
  - role: user
    permission:
      columns:
        - type
        - config
      filter:
        _or:
          - _and:
              - type:
                  _eq: "webhook"
              - workflow:
                  org:
                    members:
                      _and:
                        - user_id:
                            _eq: X-Hasura-User-Id
                        - role:
                            _eq: owner
          - _and:
              - type:
                  _neq: "webhook"
              - workflow:
                  org:
                    members:
                      _and:
                        - user_id:
                            _eq: X-Hasura-User-Id
                        - role:
                            _in:
                              - owner
                              - editor
      check: null
delete_permissions:
  - role: user
    permission:
      filter:
        _or:
          - _and:
              - type:
                  _eq: "webhook"
              - workflow:
                  org:
                    members:
                      _and:
                        - user_id:
                            _eq: X-Hasura-User-Id
                        - role:
                            _eq: owner
          - _and:
              - type:
                  _neq: "webhook"
              - workflow:
                  org:
                    members:
                      _and:
                        - user_id:
                            _eq: X-Hasura-User-Id
                        - role:
                            _in:
                              - owner
                              - editor
